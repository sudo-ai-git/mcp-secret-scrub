[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-secret-scrub"
version = "1.0.0"
description = "Deterministic, no-LLM MCP server that scrubs secrets from text/logs/transcripts before they enter agent context. Never leaks the value."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sudo-ai-git", email = "sudo-ai-git@users.noreply.github.com" }]
keywords = ["mcp", "mcp-server", "security", "secrets", "redaction", "llm-agents", "supply-chain", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/sudo-ai-git/mcp-secret-scrub"
Repository = "https://github.com/sudo-ai-git/mcp-secret-scrub"

[project.scripts]
mcp-secret-scrub = "mcp_server:main_entry"

[tool.setuptools]
py-modules = ["mcp_server"]
